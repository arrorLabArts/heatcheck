x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: postgres://${POSTGRES_USER:-heatcheck}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-heatcheck}?sslmode=${POSTGRES_SSLMODE:-disable}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?DATA_ENCRYPTION_KEY is required}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
  EMAIL_VERIFICATION_TTL: ${EMAIL_VERIFICATION_TTL:-24h}
  PASSWORD_RESET_TTL: ${PASSWORD_RESET_TTL:-1h}
  ACCOUNT_EXPORT_TTL: ${ACCOUNT_EXPORT_TTL:-24h}
  ACCOUNT_DELETE_GRACE_PERIOD: ${ACCOUNT_DELETE_GRACE_PERIOD:-168h}
  ORIGINAL_MEDIA_RETENTION: ${ORIGINAL_MEDIA_RETENTION:-720h}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-}"
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
  SAFETY_ALERT_EMAIL: ${SAFETY_ALERT_EMAIL:?SAFETY_ALERT_EMAIL is required}
  LEGAL_ALERT_EMAIL: ${LEGAL_ALERT_EMAIL:?LEGAL_ALERT_EMAIL is required}
  BOOTSTRAP_ADMIN_EMAILS: "${BOOTSTRAP_ADMIN_EMAILS:-}"
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
  MINIMUM_AGE: ${MINIMUM_AGE:-18}
  VIDEO_MIN_DURATION: ${VIDEO_MIN_DURATION:-15s}
  VIDEO_MAX_DURATION: ${VIDEO_MAX_DURATION:-30s}
  REQUIRE_WORKER: "${REQUIRE_WORKER:-true}"
  WORKER_STALE_AFTER: ${WORKER_STALE_AFTER:-5m}
  UPLOAD_URL_TTL: ${UPLOAD_URL_TTL:-15m}
  SUBMISSION_RESERVATION_TTL: ${SUBMISSION_RESERVATION_TTL:-24h}
  REVENUECAT_BASE_URL: ${REVENUECAT_BASE_URL:-https://api.revenuecat.com/v1}
  REVENUECAT_SECRET_API_KEY: ${REVENUECAT_SECRET_API_KEY:?REVENUECAT_SECRET_API_KEY is required}
  REVENUECAT_ENTITLEMENT_ID: ${REVENUECAT_ENTITLEMENT_ID:-pro}
  REVENUECAT_APP_ID: ${REVENUECAT_APP_ID:?REVENUECAT_APP_ID is required}
  REVENUECAT_WEBHOOK_AUTHORIZATION: "${REVENUECAT_WEBHOOK_AUTHORIZATION:?REVENUECAT_WEBHOOK_AUTHORIZATION is required}"
  REVENUECAT_WEBHOOK_SIGNING_SECRET: ${REVENUECAT_WEBHOOK_SIGNING_SECRET:?REVENUECAT_WEBHOOK_SIGNING_SECRET is required}
  REVENUECAT_WEBHOOK_TOLERANCE: ${REVENUECAT_WEBHOOK_TOLERANCE:-5m}
  REVENUECAT_ALLOW_SANDBOX: "${REVENUECAT_ALLOW_SANDBOX:-false}"
  REVENUECAT_TIMEOUT: ${REVENUECAT_TIMEOUT:-10s}
  PRO_DAILY_SUBMISSION_LIMIT: ${PRO_DAILY_SUBMISSION_LIMIT:-1}
  PRO_MONTHLY_SUBMISSION_LIMIT: ${PRO_MONTHLY_SUBMISSION_LIMIT:-30}
  GLOBAL_DAILY_SUBMISSION_LIMIT: ${GLOBAL_DAILY_SUBMISSION_LIMIT:-100}
  S3_ENDPOINT: ${S3_ENDPOINT:-minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?S3_PUBLIC_ENDPOINT is required}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  S3_BUCKET: ${S3_BUCKET:-heatcheck-clips}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_INTERNAL_USE_SSL: "${S3_INTERNAL_USE_SSL:-false}"
  S3_PUBLIC_USE_SSL: "${S3_PUBLIC_USE_SSL:-false}"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heatcheck}
      POSTGRES_USER: ${POSTGRES_USER:-heatcheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - "${POSTGRES_DATA_PATH:-postgres-data}:/var/lib/postgresql/data"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - "${MINIO_DATA_PATH:-minio-data}:/data"
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_BUCKET: ${S3_BUCKET:-heatcheck-clips}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done
        mc mb --ignore-existing "local/$${S3_BUCKET}"
        cat > /tmp/heatcheck-api-policy.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetBucketLocation", "s3:ListBucket"],
              "Resource": ["arn:aws:s3:::$${S3_BUCKET}"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"],
              "Resource": ["arn:aws:s3:::$${S3_BUCKET}/*"]
            }
          ]
        }
        EOF
        mc admin policy create local heatcheck-api /tmp/heatcheck-api-policy.json
        mc admin user add local "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"
        mc admin policy attach local heatcheck-api --user "$${S3_ACCESS_KEY}"

  api:
    image: heatcheck-app:local
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      <<: *app-environment
      PORT: "8080"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  clamav:
    image: clamav/clamav:1.5.3
    restart: unless-stopped
    volumes:
      - "${CLAMAV_DATA_PATH:-clamav-data}:/var/lib/clamav"
    expose:
      - "3310"
    security_opt:
      - no-new-privileges:true

  worker:
    image: heatcheck-app:local
    build:
      context: .
      target: app
    entrypoint: ["heatcheck-worker"]
    restart: unless-stopped
    environment:
      <<: *app-environment
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_VERIFICATION_MODEL: ${OPENAI_VERIFICATION_MODEL:-gpt-5.6-sol}
      OPENAI_MODERATION_MODEL: ${OPENAI_MODERATION_MODEL:-omni-moderation-latest}
      OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-90s}
      AI_FRAME_COUNT: ${AI_FRAME_COUNT:-8}
      AI_MIN_CONFIDENCE: ${AI_MIN_CONFIDENCE:-0.80}
      CLAMAV_ADDRESS: ${CLAMAV_ADDRESS:-clamav:3310}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      SAFETY_ALERT_EMAIL: ${SAFETY_ALERT_EMAIL:?SAFETY_ALERT_EMAIL is required}
      LEGAL_ALERT_EMAIL: ${LEGAL_ALERT_EMAIL:?LEGAL_ALERT_EMAIL is required}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-starttls}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-30s}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-2s}
      WORKER_JOB_TIMEOUT: ${WORKER_JOB_TIMEOUT:-3m}
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  clamav-data:
