openapi: 3.1.0
info:
  title: HeatCheck Public API
  version: 0.1.0
  description: |
    API for HeatCheck challenges, proof clips, voting, moderation, and
    copyright workflows. All timestamps use RFC 3339 UTC values.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: System
  - name: Policies
  - name: Authentication
  - name: Challenges
  - name: Media
  - name: Submissions
  - name: Safety
  - name: Copyright
  - name: Administration
paths:
  /healthz:
    get:
      tags: [System]
      operationId: health
      responses:
        "200":
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /readyz:
    get:
      tags: [System]
      operationId: readiness
      responses:
        "200":
          description: Service dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          $ref: "#/components/responses/Error"
  /v1/policies:
    get:
      tags: [Policies]
      operationId: listCurrentPolicies
      responses:
        "200":
          description: Current policy documents.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Policy"
  /v1/policies/{kind}:
    parameters:
      - $ref: "#/components/parameters/PolicyKind"
    get:
      tags: [Policies]
      operationId: getCurrentPolicy
      responses:
        "200":
          description: Current policy document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyEnvelope"
        "404":
          $ref: "#/components/responses/Error"
  /v1/auth/register:
    post:
      tags: [Authentication]
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - handle
                - display_name
                - date_of_birth
                - policy_acceptances
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 10
                  maxLength: 128
                  writeOnly: true
                handle:
                  type: string
                  pattern: "^[a-z0-9_]{3,24}$"
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 60
                date_of_birth:
                  type: string
                  format: date
                policy_acceptances:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/PolicyAcceptance"
      responses:
        "201":
          description: Account and session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  writeOnly: true
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      requestBody:
        $ref: "#/components/requestBodies/RefreshToken"
      responses:
        "200":
          description: Refresh token rotated and session renewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      requestBody:
        $ref: "#/components/requestBodies/RefreshToken"
      responses:
        "204":
          description: Refresh token revoked.
        "401":
          $ref: "#/components/responses/Error"
  /v1/me:
    get:
      tags: [Authentication]
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current account and missing policy acceptances.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [user, missing_policy_acceptances]
                    properties:
                      user:
                        $ref: "#/components/schemas/PrivateUser"
                      missing_policy_acceptances:
                        type: array
                        items:
                          $ref: "#/components/schemas/PolicyAcceptance"
        "401":
          $ref: "#/components/responses/Error"
  /v1/me/policy-acceptances:
    post:
      tags: [Policies]
      operationId: acceptPolicies
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [policy_acceptances]
              properties:
                policy_acceptances:
                  type: array
                  minItems: 1
                  items:
                    $ref: "#/components/schemas/PolicyAcceptance"
      responses:
        "204":
          description: Policies accepted.
        "401":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
  /v1/challenges:
    get:
      tags: [Challenges]
      operationId: listChallenges
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: include_private
          in: query
          schema:
            type: boolean
          description: Moderator-only switch for draft and unlisted challenges.
      responses:
        "200":
          description: Challenges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeListEnvelope"
  /v1/challenges/daily:
    get:
      tags: [Challenges]
      operationId: getDailyChallenge
      responses:
        "200":
          description: Active daily challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeEnvelope"
        "404":
          $ref: "#/components/responses/Error"
  /v1/challenges/{challengeID}:
    parameters:
      - $ref: "#/components/parameters/ChallengeID"
    get:
      tags: [Challenges]
      operationId: getChallenge
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeEnvelope"
        "404":
          $ref: "#/components/responses/Error"
  /v1/challenges/{challengeID}/submissions:
    parameters:
      - $ref: "#/components/parameters/ChallengeID"
    get:
      tags: [Submissions]
      operationId: listChallengeSubmissions
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - name: include_private
          in: query
          schema:
            type: boolean
          description: Moderator-only switch for non-public submissions.
      responses:
        "200":
          description: Ranked, blocking-aware submissions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionListEnvelope"
    post:
      tags: [Submissions]
      operationId: createSubmission
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [media_upload_id]
              properties:
                media_upload_id:
                  type: string
                  format: uuid
                caption:
                  type: string
                  maxLength: 280
      responses:
        "201":
          description: Submission created in pending moderation state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
  /v1/uploads:
    post:
      tags: [Media]
      operationId: createUpload
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, size_bytes]
              properties:
                content_type:
                  type: string
                  enum: [video/mp4, video/quicktime, video/webm]
                size_bytes:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        "201":
          description: Signed object-storage upload initialized.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadInstructionEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
  /v1/uploads/{uploadID}/complete:
    parameters:
      - $ref: "#/components/parameters/UploadID"
    post:
      tags: [Media]
      operationId: completeUpload
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Uploaded object verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
  /v1/submissions/{submissionID}:
    parameters:
      - $ref: "#/components/parameters/SubmissionID"
    get:
      tags: [Submissions]
      operationId: getSubmission
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Public submission, or private submission for its owner or a moderator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionEnvelope"
        "404":
          $ref: "#/components/responses/Error"
  /v1/submissions/{submissionID}/vote:
    parameters:
      - $ref: "#/components/parameters/SubmissionID"
    put:
      tags: [Submissions]
      operationId: upsertVote
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score:
                  type: integer
                  minimum: 1
                  maximum: 5
      responses:
        "200":
          description: Vote stored and aggregate score updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionEnvelope"
        "403":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
  /v1/users/{userID}:
    parameters:
      - $ref: "#/components/parameters/UserID"
    get:
      tags: [Submissions]
      operationId: getPublicUser
      responses:
        "200":
          description: Public profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUserEnvelope"
        "404":
          $ref: "#/components/responses/Error"
  /v1/users/{userID}/block:
    parameters:
      - $ref: "#/components/parameters/UserID"
    put:
      tags: [Safety]
      operationId: blockUser
      security:
        - bearerAuth: []
      responses:
        "204":
          description: User blocked.
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [Safety]
      operationId: unblockUser
      security:
        - bearerAuth: []
      responses:
        "204":
          description: User unblocked.
        "404":
          $ref: "#/components/responses/Error"
  /v1/reports:
    post:
      tags: [Safety]
      operationId: createReport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReport"
      responses:
        "201":
          description: Report queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportEnvelope"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"
  /v1/copyright/notices:
    post:
      tags: [Copyright]
      operationId: createCopyrightNotice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCopyrightNotice"
      responses:
        "201":
          description: Notice received. Sensitive claimant data is not echoed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyrightReceiptEnvelope"
        "422":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /v1/copyright/notices/{noticeID}/counter:
    parameters:
      - $ref: "#/components/parameters/NoticeID"
    post:
      tags: [Copyright]
      operationId: createCopyrightCounterNotice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCounterNotice"
      responses:
        "201":
          description: Counter-notice received from the affected uploader.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyrightReceiptEnvelope"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/moderation/actions/{actionID}/appeals:
    parameters:
      - $ref: "#/components/parameters/ActionID"
    post:
      tags: [Safety]
      operationId: createAppeal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 20
                  maxLength: 2000
      responses:
        "201":
          description: Appeal received.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealEnvelope"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /v1/admin/challenges:
    post:
      tags: [Administration]
      operationId: adminCreateChallenge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChallenge"
      responses:
        "201":
          description: Challenge created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeEnvelope"
        "403":
          $ref: "#/components/responses/Error"
  /v1/admin/submissions:
    get:
      tags: [Administration]
      operationId: adminListSubmissions
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ModerationStatus"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Moderation queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionListEnvelope"
        "403":
          $ref: "#/components/responses/Error"
  /v1/admin/submissions/{submissionID}/verification:
    parameters:
      - $ref: "#/components/parameters/SubmissionID"
    put:
      tags: [Administration]
      operationId: adminUpdateVerification
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, passed, failed, manual_review]
                details:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Verification result recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionEnvelope"
  /v1/admin/reports:
    get:
      tags: [Administration]
      operationId: adminListReports
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, reviewing, resolved, dismissed]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Report queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportListEnvelope"
  /v1/admin/reports/{reportID}/dismiss:
    parameters:
      - $ref: "#/components/parameters/ReportID"
    post:
      tags: [Administration]
      operationId: adminDismissReport
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  minLength: 10
                  maxLength: 2000
      responses:
        "200":
          description: Report dismissed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportEnvelope"
  /v1/admin/moderation/actions:
    post:
      tags: [Administration]
      operationId: adminCreateModerationAction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModerationAction"
      responses:
        "201":
          description: Enforcement action applied and audited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationActionEnvelope"
  /v1/admin/appeals:
    get:
      tags: [Administration]
      operationId: adminListAppeals
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, upheld, reversed]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Appeals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealListEnvelope"
  /v1/admin/appeals/{appealID}:
    parameters:
      - $ref: "#/components/parameters/AppealID"
    put:
      tags: [Administration]
      operationId: adminReviewAppeal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, resolution_note]
              properties:
                status:
                  type: string
                  enum: [upheld, reversed]
                resolution_note:
                  type: string
                  minLength: 10
                  maxLength: 2000
      responses:
        "200":
          description: Appeal reviewed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppealEnvelope"
  /v1/admin/copyright/notices:
    get:
      tags: [Administration]
      operationId: adminListCopyrightNotices
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [received, reviewing, actioned, rejected, countered, restored, closed]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Copyright notice queue including private claimant data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyrightNoticeListEnvelope"
  /v1/admin/copyright/notices/{noticeID}:
    parameters:
      - $ref: "#/components/parameters/NoticeID"
    put:
      tags: [Administration]
      operationId: adminReviewCopyrightNotice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, resolution_note]
              properties:
                status:
                  type: string
                  enum: [reviewing, actioned, rejected, restored, closed]
                resolution_note:
                  type: string
                  minLength: 10
                  maxLength: 2000
                counter_notice_due:
                  type: [string, "null"]
                  format: date-time
      responses:
        "200":
          description: Copyright notice state changed and linked content updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyrightNoticeEnvelope"
  /v1/admin/audit-events:
    get:
      tags: [Administration]
      operationId: adminListAuditEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Reverse-chronological audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListEnvelope"
  /v1/admin/policies:
    post:
      tags: [Administration]
      operationId: adminPublishPolicy
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishPolicy"
      responses:
        "201":
          description: Immutable policy version published as current.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyEnvelope"
        "403":
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    PolicyKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
    ChallengeID:
      name: challengeID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UploadID:
      name: uploadID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubmissionID:
      name: submissionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NoticeID:
      name: noticeID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ActionID:
      name: actionID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportID:
      name: reportID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppealID:
      name: appealID
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [refresh_token]
            properties:
              refresh_token:
                type: string
                writeOnly: true
  responses:
    Error:
      description: Structured API error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
    Pagination:
      type: object
      required: [limit, offset]
      properties:
        limit:
          type: integer
        offset:
          type: integer
    PolicyAcceptance:
      type: object
      required: [kind, version]
      properties:
        kind:
          type: string
        version:
          type: string
    Policy:
      type: object
      required: [kind, version, title, content, requires_acceptance, effective_at]
      properties:
        kind:
          type: string
        version:
